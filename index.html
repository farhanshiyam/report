    vLoad: 'রিপোর্ট লোড হচ্ছে...', vNone: 'রিপোর্ট পাওয়া যায়নি বা মেয়াদ শেষ।', vPrint: 'প্রিন্ট / PDF',

};
const rl = k => (RL[lang()] && RL[lang()][k] != null) ? RL[lang()][k] : (RL.en[k] != null ? RL.en[k] : k);

  + ".rp .sum{display:flex;gap:8px;margin:10px 0 14px}.rp .sum div{flex:1;min-width:0;break-inside:avoid;border:1px solid #d5dce5;border-left:3px solid #1f4e79;border-radius:6px;padding:7px 10px;background:#f7f9fc}.rp .sum small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:#5a6776}.rp .sum b{font-size:15px}.rp .sum .bad{border-left-color:#b71c1c}.rp .sum .bad b{color:#b71c1c}"

  + ".rp .ft{break-inside:avoid;page-break-inside:avoid;display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:8px;border-top:2px solid #c9a227;font-size:10px;color:#4a5766;text-align:left}.rp .qr{width:64px;height:64px;flex:none;padding:3px;border:1px solid #d5dce5;border-radius:4px;background:#fff}.rp .qr svg{width:100%;height:100%;display:block}"

/* d = { typeId, g ('addr' | 'src' | ''), rows:[{name,phone,addr,src,due,paid,bal}], notes:[], gen, no, url, qr } */
function reportHtml(d) {
  const rows = d.rows; let sd = 0, sp = 0, sb = 0, n = 0; rows.forEach(r => { sd += r.due; sp += r.paid; sb += r.bal; });
  const tr = r => '<tr><td class="sl">' + (++n) + '</td><td>' + esc(r.name || '-') + '</td><td>' + esc(r.phone) + '</td><td>' + esc(r.addr) + '</td><td>' + esc(r.src) + '</td><td class="n">' + money(r.due) + '</td><td class="n">' + money(r.paid) + '</td><td class="n d">' + money(r.bal) + '</td></tr>';
  const sub = (cls, l, a, b, c) => '<tr class="' + cls + '"><td colspan="5">' + esc(l) + '</td><td class="n">' + money(a) + '</td><td class="n">' + money(b) + '</td><td class="n">' + money(c) + '</td></tr>';
  let body = '';
  if (d.g) {
    const key = d.g, none = rl(key === 'addr' ? 'cNoAddr' : 'cNoSrc'), gs = {};
    rows.forEach(r => { const k = r[key] || none; (gs[k] = gs[k] || []).push(r); });
    Object.keys(gs).sort((a, b) => a.localeCompare(b, 'en', { numeric: true })).forEach(k => {
      let a = 0, b = 0, c = 0; gs[k].forEach(r => { a += r.due; b += r.paid; c += r.bal; });
      body += '<tr class="gh"><td colspan="8">' + esc(k) + ' (' + gs[k].length + ')</td></tr>' + gs[k].map(tr).join('') + sub('st', rl('cSub'), a, b, c);
    });
  } else body = rows.map(tr).join('');
  if (d.gt !== false) body += sub('gt', rl('cTot'), sd, sp, sb);
  const sm = (l, v, c) => '<div' + (c ? ' class="' + c + '"' : '') + '><small>' + esc(l) + '</small><b>' + esc(v) + '</b></div>';
  const th = (l, c) => '<th' + (c ? ' class="' + c + '"' : '') + '>' + esc(rl(l)) + '</th>';
  return '<div class="rp"><div class="lh"><div class="lg">RGCE</div><div class="lt"><h1>' + esc(SHOP_NAME) + '</h1><p class="tg">' + esc(SHOP_TAG) + '</p><p>' + esc(SHOP_ADDR) + ' \u2022 ' + esc(SHOP_PHONE) + '</p></div>'
    + '<div class="rn"><b>REPORT</b><span>' + esc(rl('cNo')) + ': ' + esc(d.no) + '</span><span>' + esc(rl('cDate')) + ': ' + esc(d.gen) + '</span></div></div>'
    + '<h2>' + esc(rl('ty_' + d.typeId)) + '</h2><div class="meta">' + esc((d.notes || []).join(' \u2022 ')) + '</div>'
    + '<table class="dt"><colgroup><col style="width:7%"><col style="width:22%"><col style="width:13%"><col style="width:24%"><col style="width:8%"><col style="width:9%"><col style="width:8%"><col style="width:9%"></colgroup>'
    + '<thead><tr>' + th('cSL', 'sl') + th('cName') + th('cPhone') + th('cAddr') + th('cSrc') + th('cBill', 'n') + th('cPaid', 'n') + th('cDue', 'n') + '</tr></thead><tbody>' + body + '</tbody>'
    + '</table><div class="ft">' + (d.qr ? '<div class="qr">' + d.qr + '</div>' : '') + '<div class="l"><b>' + esc(rl('cOnline')) + '</b><br><a href="' + esc(d.url) + '">' + esc(d.url) + '</a><br>Powered by Farhan Tanzid Shiyam</div>'
    + '<div class="r"><b>' + esc(SHOP_NAME) + '</b><br>' + esc(SHOP_ADDR) + '<br>' + esc(SHOP_PHONE) + '</div></div></div>';
}
function printHtml(html, name) {
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write('<!doctype html><html><head><meta charset="utf-8"><title>' + esc(name) + '</title><style>' + RCSS + PCSS + '</style></head><body>' + html + '</body></html>'); d.close();
  setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) {} setTimeout(() => f.remove(), 3000); }, 400);
}

document.getElementById('rcss').textContent = RCSS + PCSS;
const id = (new URLSearchParams(location.search).get('r') || '').replace(/[^a-z0-9]/gi, '');

  $('out').innerHTML = reportHtml({ typeId: data.typeId, g: data.g || '', gt: data.gt !== false, rows, notes: data.notes || [], gen: data.gen, no: data.no, url, qr: qrSvg(url) });
  document.title = rl('ty_' + data.typeId) + ' - ' + SHOP_NAME;
};

$('bl').textContent = cur === 'bn' ? 'English' : '\u09AC\u09BE\u0982\u09B2\u09BE'; $('bp').textContent = rl('vPrint'); $('msg').textContent = rl('vLoad');
try {
  if (!id) throw new Error('no id');
  let m; try { m = await Promise.all(['app', 'firestore'].map(k => import('https://www.gstatic.com/firebasejs/10.12.0/firebase-' + k + '.js'))); }
  catch (e) { m = await Promise.all(['app', 'firestore'].map(k => import('https://cdn.jsdelivr.net/npm/firebase@10.12.0/' + k + '/+esm'))); }
  const { initializeApp } = m[0], { initializeFirestore, doc, getDoc } = m[1];
  const db = initializeFirestore(initializeApp(firebaseConfig, 'rgce-report'), { experimentalAutoDetectLongPolling: true });
  const snap = await getDoc(doc(db, 'site_public', 'rpt-' + id));
  const d = snap.exists() ? snap.data() : null;
  if (!d || !Array.isArray(d.rows) || (d.expiresAt && Date.now() > d.expiresAt)) throw new Error('none');
  data = d; if (d.lang === 'bn' || d.lang === 'en') { try { if (!localStorage.getItem('rgce_lang')) cur = d.lang; } catch (e) { cur = d.lang; } }
  await draw();
} catch (e) { console.warn(e); $('out').innerHTML = '<div class="msg">' + esc(rl('vNone')) + '</div>'; }
